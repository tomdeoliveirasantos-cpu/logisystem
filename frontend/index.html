<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LogiSystem" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" id="app-manifest" />
  <script>
    // A área do motorista (/m/) instala como app próprio, com escopo separado
    if (location.pathname.startsWith('/m')) {
      document.getElementById('app-manifest').setAttribute('href', '/manifest-motorista.json');
      document.querySelector('meta[name="apple-mobile-web-app-title"]')
        ?.setAttribute('content', 'LogiSystem Motorista');
    }
  </script>
  <title>LogiSystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet" />
  <!-- SheetJS para export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
